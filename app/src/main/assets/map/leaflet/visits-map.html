<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Leaflet Map</title>
    <link rel="stylesheet" href="leaflet-2.0.0-beta.3.css"/>
    <style>
        #map {
            height: 100vh;
            width: 100%;
        }
        body {
            margin: 0;
            padding: 0;
        }
        @media (prefers-color-scheme: dark) {
            #map { filter: brightness(0.7); }
        }
    </style>
</head>
<body>
<div id="map"></div>
<!-- This is the IIFE/global build (unpkg's leaflet-global.js), not leaflet.js, which is ESM-only
     and will not load from a file:// WebView. Since 2.0.0-beta.1 it exposes window.L (the alpha used
     window.leaflet), and v2 removed the lowercase factory helpers, so classes are constructed with `new L.X()`. Coordinates are
     [latitude, longitude] here — the opposite of the MapLibre engine. -->
<script src="leaflet-2.0.0-beta.3.js"></script>
<script>
    let map;
    let currentLocation = null; // store current location
    let routeLayer = null; // store route layer
    let currentLocationMarker = null; // marker for current location
    let visitMarkers = []; // track all visit markers for cleanup
    // Pins whose icons would overlap at the current zoom are shown as one grouped pin ("5·6")
    // placed on the earliest stop's real coordinates, so no pin is ever drawn off its address
    // and none hides another. Zooming in far enough splits the group again.
    const PIN_WIDTH = 25;
    const PIN_HEIGHT = 41;
    let visitPins = [];
    let visitGroupsKey = null;
    let labels = {
        currentLocation: undefined,
    };
    let didFitBounds = false;

    function log(message) {
        console.log(message);
        if (window.Visits && window.Visits.log) {
            window.Visits.log(message);
        }
    }

    function logError(message) {
        console.error(message);
        if (window.Visits && window.Visits.error) {
            window.Visits.error(message);
        }
    }

    log('Script loaded successfully');

    // Changed: now only receives the text for current location popup
    async function initializeMap(currentLocationText) {
        try {
            log('Initializing map (no coordinates yet)');

            if (typeof L === 'undefined') {
                throw new Error('Leaflet library not loaded');
            }

            labels.currentLocation = currentLocationText;

            // Initialize map with a neutral view; real center will be applied in setMarkers
            map = new L.Map('map').setView([0, 0], 2);

            new L.TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
              attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            map.on('zoomend', renderVisitMarkers);

            log('Map initialized successfully (awaiting coordinates)');

            if (window.Visits && window.Visits.onMapReady) {
                window.Visits.onMapReady();
            }
        } catch (error) {
            logError('Map initialization error: ' + error.message);
            if (window.Visits && window.Visits.onMapInitializationError) {
               window.Visits.onMapInitializationError(error.message || error.toString());
            }
        }
    }

    // Two pins overlap when their bottom-anchored icons intersect on screen. A pin joins the
    // first group holding any pin it overlaps; pins are visited in route order, so each group's
    // first member is its earliest stop.
    function groupVisitPins(pins) {
        const groups = [];
        pins.forEach(pin => {
            const point = map.latLngToContainerPoint(pin.latLng);
            const group = groups.find(g => g.points.some(p =>
                Math.abs(p.x - point.x) < PIN_WIDTH && Math.abs(p.y - point.y) < PIN_HEIGHT));
            if (group) {
                group.pins.push(pin);
                group.points.push(point);
            } else {
                groups.push({ pins: [pin], points: [point] });
            }
        });
        return groups.map(g => g.pins);
    }

    function renderVisitMarkers() {
        if (!map) return;
        const groups = groupVisitPins(visitPins);
        // zoomend fires on every pinch; rebuilding unchanged markers would close an open popup
        const key = groups.map(g => g.map(p => p.index).join(',')).join('|');
        if (key === visitGroupsKey) return;
        visitGroupsKey = key;

        visitMarkers.forEach(m => map.removeLayer(m));
        visitMarkers = [];

        const redIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        groups.forEach(group => {
            const first = group[0];
            const popupContent = group.map(p => p.popupContent)
                .join('<hr style="border: none; border-top: 1px solid #ddd; margin: 6px 0;">');

            const marker = new L.Marker(first.latLng, { icon: redIcon })
                .addTo(map)
                .on('click', () => {
                    if (window.Visits && window.Visits.onMarkerClicked) {
                        window.Visits.onMarkerClicked('marker_' + first.index);
                    }
                })
                .bindPopup(popupContent);
            visitMarkers.push(marker);

            // Stop number(s) as a badge overlay; a group's badge widens into a pill to fit them all
            const numberIcon = new L.DivIcon({
                className: 'visit-order-number',
                html: '<div style="background: white; border: 2px solid red; border-radius: 10px; min-width: 20px; height: 20px; padding: 0 4px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; color: red; white-space: nowrap; margin-left: 18px; margin-top: -8px;">' +
                    group.map(p => p.label).join('·') + '</div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });

            visitMarkers.push(new L.Marker(first.latLng, { icon: numberIcon })
                .addTo(map));
        });
    }

    // Changed: now receives latitude, longitude plus visits
    async function setMarkers(latitude, longitude, visits) {
        try {
           if (!map) {
               logError('Map not initialized');
               return;
           }

           log('Setting markers...');

           // Update current location
           currentLocation = [latitude, longitude];

           // Manage current location marker
           if (currentLocationMarker) {
               map.removeLayer(currentLocationMarker);
           }
           currentLocationMarker = new L.Marker(currentLocation)
               .addTo(map)
               .bindPopup(labels.currentLocation);

           visitPins = [];

           // Clear existing route layer
           if (routeLayer) {
               map.removeLayer(routeLayer);
               routeLayer = null;
           }

           const bounds = new L.LatLngBounds([]);

           // Always include current location in bounds
           if (currentLocation) {
               bounds.extend(currentLocation);
           }

            if (visits && visits.length > 0) {
                // Sort visits by visitOrder for proper route display
                const sortedVisits = visits.slice().sort((a, b) => a.visitOrder - b.visitOrder);

                // Add markers for each visit
                sortedVisits.forEach((visit, index) => {
                    if (visit && visit.householderLatitude && visit.householderLongitude) {
                        const { householderLatitude, householderLongitude, householderName, householderDistance, visitSubject, visitOrder } = visit;

                        log('Adding marker for: ' + householderName + ' at ' + householderLatitude + ', ' + householderLongitude + ' (order: ' + visitOrder + ')');

                        const popupContent = '<div>' +
                            '<div style="display: flex; justify-content: space-between; align-items: center;">' +
                                '<strong>' + householderName + '</strong>' +
                                '<span style="font-size: 0.9em; color: #666;">Order: ' + (visitOrder + 1) + '</span>' +
                            '</div>' +
                            '<div style="display: flex; justify-content: space-between; align-items: center;">' +
                                '<span>' + visitSubject + '</span>' +
                                '<span style="font-size: 0.9em; color: #666;">' + (householderDistance || '') + '</span>' +
                            '</div>' +
                            visit.householderAddress + '<br/>' +
                        '</div>';

                        visitPins.push({
                            index,
                            latLng: [householderLatitude, householderLongitude],
                            label: String(visitOrder + 1),
                            popupContent
                        });

                        bounds.extend([householderLatitude, householderLongitude]);
                    }
                });

                // Draw route if routeGeometry is available
                if (sortedVisits.length > 0 && sortedVisits[0].routeGeometry) {
                    try {
                        log('Drawing route with geometry');
                        const routeGeometry = sortedVisits[0].routeGeometry;

                        // Create route line with styling
                        routeLayer = new L.GeoJSON(routeGeometry, {
                            style: {
                                color: '#2E86AB',
                                weight: 4,
                                opacity: 0.8,
                                lineJoin: 'round',
                                lineCap: 'round'
                            }
                        }).addTo(map);

                        log('Route drawn successfully');
                    } catch (error) {
                        logError('Error drawing route: ' + error.message);
                    }
                } else {
                    // Fallback: draw simple line connecting visits in order
                    if (sortedVisits.length > 0) {
                        log('Drawing simple route line');
                        const routePoints = [];

                        // Start from current location if available
                        if (currentLocation) {
                            routePoints.push(currentLocation);
                        }

                        // Add all visit locations in order
                        sortedVisits.forEach(visit => {
                            if (visit.householderLatitude && visit.householderLongitude) {
                                routePoints.push([visit.householderLatitude, visit.householderLongitude]);
                            }
                        });

                        if (routePoints.length > 1) {
                            routeLayer = new L.Polyline(routePoints, {
                                color: '#2E86AB',
                                weight: 3,
                                opacity: 0.6,
                                dashArray: '5, 10'
                            }).addTo(map);
                        }
                    }
                }

                if (!didFitBounds && bounds.isValid()) {
                    didFitBounds = true;
                    map.fitBounds(bounds, { padding: [20, 20] });
                }

                // Grouping depends on screen distance; an animated fitBounds regroups on zoomend
                visitGroupsKey = null;
                renderVisitMarkers();

                log('All markers added successfully');
            } else {
                log('No visits provided or visits array is empty.');
                visitGroupsKey = null;
                renderVisitMarkers();

                // Only center on current location if no other markers
                if (!didFitBounds && currentLocation) {
                    didFitBounds = true;
                    map.setView(currentLocation, 15);
                }
            }
        } catch (error) {
            logError('Error setting markers: ' + error.message);
            if (window.Visits && window.Visits.onMapInitializationError) {
                window.Visits.onMapInitializationError(error.message || error.toString());
            }
        }
    }

    window.onerror = function(message, source, lineno, colno, error) {
        logError('JavaScript error: ' + message + ' at ' + source + ' ' + lineno + ':' + colno);
        if (window.Visits && window.Visits.onMapInitializationError) {
            window.Visits.onMapInitializationError(message);
        }
    };
</script>
</body>
</html>
